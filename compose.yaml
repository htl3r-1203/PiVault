name: pivault

services:
  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_SSL_PORT:-8443}:443"
    volumes:
      - ./ssl:/usr/local/apache2/conf/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /usr/local/apache2/logs:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,pivault}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:?in .env setzen}
      DB_USER: ${MARIADB_USER:?in .env setzen}
      DB_PASSWORD: ${MARIADB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      # Sessions (optional in .env überschreibbar). Für HTTPS COOKIE_SECURE=true setzen.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-480}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - frontend-net
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1024m
    cpus: 2.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  database:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:?in .env setzen}
      MARIADB_USER: ${MARIADB_USER:?in .env setzen}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
      MARIADB_PASSWORD_FILE: ${MARIADB_PASSWORD_FILE:-}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      MARIADB_ROOT_PASSWORD_FILE: ${MARIADB_ROOT_PASSWORD_FILE:-}
    volumes:
      - pivault_db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/privileges.sh:/docker-entrypoint-initdb.d/02-privileges.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    mem_limit: 1536m
    cpus: 2.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  pivault_db_data:
