ServerName localhost

# Dateiliste nicht anzeigen, Server-Version verbergen, TRACE deaktivieren
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Request-Body-Größe auf Webserver-Ebene begrenzen (10 MB)
LimitRequestBody 10485760

# HTTP-Sicherheitsheader (Standard für alle Antworten)
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

# /api -> FastAPI-Container (nur im internen Docker-Netzwerk erreichbar)
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}

ProxyPass        /api http://backend:8000/api
ProxyPassReverse /api http://backend:8000/api

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted

    # SPA-Fallback: unbekannte Pfade (Vue-Router-Routen) liefern index.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api(/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

# ------------------------------------------------------------------------------
# TLS / HTTPS Konfiguration
# ------------------------------------------------------------------------------
# Aktiviert sich automatisch, sobald ein gültiges Zertifikat gemountet ist:
#   /usr/local/apache2/conf/ssl/fullchain.pem
#   /usr/local/apache2/conf/ssl/privkey.pem
# Ist kein Zertifikat vorhanden (z. B. LAN-Betrieb oder Erstinstallation),
# bleibt der Server sicher über HTTP erreichbar, ohne abzustürzen.
# ------------------------------------------------------------------------------
<IfFile "/usr/local/apache2/conf/ssl/fullchain.pem">
    Listen 443

    # TLS-Härtung: Ausschließlich TLS 1.2 und TLS 1.3
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # SSL Session Cache im beschreibbaren tmpfs (/tmp)
    SSLSessionCache shmcb:/tmp/ssl_scache(512000)
    SSLSessionCacheTimeout 300

    <VirtualHost *:443>
        ServerName localhost

        SSLEngine on
        SSLCertificateFile /usr/local/apache2/conf/ssl/fullchain.pem
        SSLCertificateKeyFile /usr/local/apache2/conf/ssl/privkey.pem

        # HSTS erst und ausschließlich bei aktivem HTTPS setzen (1 Jahr, inkl. Subdomains)
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port "443"

        ProxyPass        /api http://backend:8000/api
        ProxyPassReverse /api http://backend:8000/api

        <Directory "/usr/local/apache2/htdocs">
            Options -Indexes
            AllowOverride None
            Require all granted

            RewriteEngine On
            RewriteCond %{REQUEST_URI} !^/api(/|$)
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ /index.html [L]
        </Directory>
    </VirtualHost>

    # Automatische HTTP -> HTTPS Weiterleitung auf Port 80, sobald HTTPS aktiv ist
    <VirtualHost *:80>
        ServerName localhost
        RewriteEngine On
        RewriteCond %{HTTPS} off
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
    </VirtualHost>
</IfFile>
