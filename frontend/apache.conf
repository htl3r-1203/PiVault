ServerName localhost

# Dateiliste nicht anzeigen, Server-Version verbergen
ServerTokens Prod
ServerSignature Off

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"

# /api -> FastAPI-Container (nur im internen Docker-Netzwerk erreichbar)
ProxyPreserveHost On
ProxyPass        /api http://backend:8000/api
ProxyPassReverse /api http://backend:8000/api

<Directory "/usr/local/apache2/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted

    # SPA-Fallback: unbekannte Pfade (Vue-Router-Routen) liefern index.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api(/|$)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>
